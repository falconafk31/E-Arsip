<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Arsip - Arsip Surat Masuk dan Keluar Madrasah</title>
<style>
/*__APP_CSS__*/
/* tambahan khusus aplikasi live */
.top .crumb{color:var(--tm)} .top .crumb b{color:var(--tx)}
.frame-file{width:100%;height:520px;border:0;border-radius:8px;background:#fff}
img.prev-img{max-width:100%;max-height:520px;border-radius:8px;background:#fff;margin:0 auto;display:block}
select.flt{width:auto}
.note.r2off{--bg:#FFF0CC;--fg:#A96100}
.snav button .ic{width:18px;height:18px}
.kop img{width:auto;object-fit:contain}
.kop .kt b{font-size:13px}
.gcari{flex:1;max-width:430px;margin:0 16px}.gcari input{width:100%;height:38px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);padding:0 16px;font-size:13.5px;color:var(--tx)}.gcari input:focus{outline:2px solid var(--ps);border-color:var(--p);background:#fff}
@media(max-width:720px){.gcari{display:none}}
.appfoot{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding:16px 24px 22px;color:var(--tf);font-size:12px}
@media(max-width:720px){.top{height:auto;min-height:56px;padding:8px 12px}.top .acts{flex-wrap:nowrap;min-width:0}.top .crumb{white-space:nowrap;overflow:hidden}.top .cinst,.top .crumb .sep{display:none}.appfoot{padding:14px 16px 18px}}
.ts button{background:#fff;color:var(--tx);border:0;border-radius:999px;padding:5px 14px;font-weight:700;cursor:pointer;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{display:inline-flex;gap:4px;align-items:center;background:var(--ps);color:var(--p);border-radius:999px;padding:4px 6px 4px 12px;font-size:12.5px;font-weight:600}.chip button{background:none;border:0;color:var(--p);font-weight:800;cursor:pointer;font-size:14px;line-height:1;padding:2px 6px}
th[data-sk]{cursor:pointer;user-select:none} th[data-sk]:hover{color:var(--p)}
#guruBody th,#guruBody td{white-space:nowrap}
.spin{width:16px;height:16px;border:2px solid var(--bd2);border-top-color:var(--p);border-radius:50%;display:inline-block;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<!--__SPRITE__-->
<div id="loginView"></div>
<div id="appView" hidden>
  <div class="app">
    <div class="ov" id="ovl"></div>
    <aside id="sb"></aside>
    <div class="mn">
      <header class="top" id="topbar"></header>
      <main id="main"></main>
      <footer class="appfoot"><span>E-Arsip - Arsip Surat Masuk dan Keluar Madrasah</span></footer>
    </div>
  </div>
</div>
<div id="modalRoot"></div>
<div class="ts" id="toast"></div>
<input type="file" id="fileLampiran" accept=".pdf,.jpg,.jpeg,.png,.webp" multiple hidden>
<input type="file" id="filePendukung" accept=".pdf,.jpg,.jpeg,.png,.webp" multiple hidden>
<input type="file" id="fileLogo" accept=".png,.jpg,.jpeg,.webp" hidden>
<script>
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ringkas = (s, n) => { if (s == null || !window.matchMedia("(max-width: 720px)").matches) return s; const k = String(s).trim().split(/\s+/); const b = n || 4; return k.length > b ? k.slice(0, b).join(" ") + "..." : s; };
const ic = (n, cls) => '<svg class="ic ' + (cls || "") + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const BULAN_ID = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
let me = null, r2Aktif = false, klasList = [], SETTINGS = {};
let cur = { p: "beranda" };
const ROLE_LABEL = { admin: "Administrator", petugas: "Petugas TU", pimpinan: "Pimpinan", viewer: "Pengamat" };

const cacheGET = new Map();
async function api(path, opt) {
  const metode = (opt && opt.method) || "GET";
  if (metode === "GET" && cacheGET.has(path)) return JSON.parse(cacheGET.get(path));
  const r = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opt || {}));
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  if (metode === "GET") cacheGET.set(path, JSON.stringify(d)); else { cacheGET.clear(); segarLencana(); }
  return d;
}
function rangka(n) { const w = [92, 76, 88, 64, 84, 70, 90, 68]; let h = '<div class="rkg" aria-hidden="true">'; for (let i = 0; i < (n || 5); i++) h += '<i style="width:' + w[i % w.length] + '%"></i>'; return h + "</div>"; }
function toast(msg, isErr) {
  const t = $("#toast");
  t.innerHTML = ic(isErr ? "warning" : "check") + "<span>" + esc(msg) + "</span>";
  t.style.background = "";
  t.classList.toggle("err", !!isErr);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}
function modal(html, cls) { $("#modalRoot").innerHTML = '<div class="md"><div class="mb ' + (cls || "") + '">' + html + "</div></div>"; }
function tutupModal() { $("#modalRoot").innerHTML = ""; }
function konfirmasi(judul, isi, labelBahaya, cb) {
  modal('<div class="m-top"><span class="danger-mark" aria-hidden="true">!</span><h3>' + esc(judul) + '</h3><p>' + isi + '</p></div><div class="modal-actions"><button class="btn sec" onclick="tutupModal()">Batal</button><button class="btn dg" id="btnKonfirm">' + esc(labelBahaya) + "</button></div>", "m-danger");
  $("#btnKonfirm").onclick = () => { tutupModal(); cb(); };
}
function fmtUkuran(b) { if (!b && b !== 0) return "-"; if (b < 1024) return b + " B"; if (b < 1048576) return (b / 1024).toFixed(1) + " KB"; return (b / 1048576).toFixed(2) + " MB"; }
function todayStr() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function ymStr() { return todayStr().slice(0, 7); }
function tglPanjangIni() { const d = new Date(); return d.getDate() + " " + BULAN_ID[d.getMonth()] + " " + d.getFullYear(); }
function fmtTgl(t) { if (!t) return "-"; const p = String(t).slice(0, 10).split("-"); return p.length === 3 ? p[2] + " " + BULAN_ID[parseInt(p[1], 10) - 1].slice(0, 3) + " " + p[0] : t; }
const ZONA_OFSET = { WIB: 7, WITA: 8, WIT: 9 };
function zonaAktif() { return ZONA_OFSET[SETTINGS.zona_waktu] !== undefined ? SETTINGS.zona_waktu : "WIB"; }
function fmtJam(ts) { if (!ts) return "-"; const d = new Date(String(ts).replace(" ", "T") + "Z"); if (isNaN(d)) return esc(ts); const l = new Date(d.getTime() + ZONA_OFSET[zonaAktif()] * 3600 * 1000); return l.getUTCDate() + " " + BULAN_ID[l.getUTCMonth()] + " " + l.getUTCFullYear() + ", " + String(l.getUTCHours()).padStart(2, "0") + "." + String(l.getUTCMinutes()).padStart(2, "0") + " " + zonaAktif(); }
function thUrut(label, key, st, extra) { const on = st.sort === key; const ik = on ? ic(st.dir === "asc" ? "arr-up" : "arr-down") : ic("arr-both"); return '<th data-sk="' + key + '" title="Klik untuk urutkan"' + (extra || "") + ">" + label + '<span class="sic ' + (on ? "on" : "dim") + '">' + ik + "</span></th>"; }
function ikatUrut(st, muatUlang) { $$("th[data-sk]").forEach((th) => (th.onclick = () => { if (st.sort === th.dataset.sk) st.dir = st.dir === "asc" ? "desc" : "asc"; else { st.sort = th.dataset.sk; st.dir = "asc"; } if ("page" in st) st.page = 1; muatUlang(); })); }
function labelTenggat(iso) { if (!iso) return null; const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()); const t = new Date(String(iso).slice(0, 10) + "T00:00:00"); const hari = Math.round((t - today) / 86400000); if (hari < 0) return { t: "Terlambat " + (-hari) + " hari", k: "dg" }; if (hari === 0) return { t: "Jatuh tempo hari ini", k: "dg" }; if (hari === 1) return { t: "Jatuh tempo besok", k: "wn" }; if (hari <= 7) return { t: hari + " hari lagi", k: "wn" }; return null; }
let toastTimer = null;
function toastAksi(pesan, label, aksi) { const t = $("#toast"); t.innerHTML = "<span>" + esc(pesan) + '</span><button type="button" id="toastBtn">' + esc(label) + "</button>"; t.classList.add("show"); clearTimeout(toastTimer); $("#toastBtn").onclick = async () => { clearTimeout(toastTimer); t.classList.remove("show"); try { await aksi(); } catch (e) { toast(e.message, true); } }; toastTimer = setTimeout(() => t.classList.remove("show"), 9000); }
function canEditNow() { return me && (me.role === "admin" || me.role === "petugas"); }
function badgeSifat(s) { return '<span class="sft">' + esc(s || "Biasa") + "</span>"; }
function badgeStatus(s) { if (s === "Selesai") return '<span class="bd ok">' + ic("check") + "Selesai</span>"; if (s === "Terlambat") return '<span class="bd dg">' + ic("warning") + "Terlambat</span>"; if (s === "Diproses") return '<span class="bd in">' + ic("clock") + "Diproses</span>"; return '<span class="bd wn">' + ic("clock") + "Belum</span>"; }
function terlambatDisp(x) { return x.status !== "Selesai" && x.batas_waktu && x.batas_waktu < todayStr(); }
function namaInstansi() { return SETTINGS.kop_baris3 || SETTINGS.nama_instansi || "E-Arsip Madrasah"; }
function inisial(n) { return String(n || "?").split(/\s+/).map((x) => x[0]).slice(0, 2).join("").toUpperCase(); }

/* ---------- login ---------- */
function renderLogin(err) {
  $("#appView").hidden = true;
  const lv = $("#loginView"); lv.hidden = false;
  lv.innerHTML = '<div class="lg"><div class="ll"><div class="bm big">' + ic("letterhead") + '</div><h1>E-Arsip</h1><p>Kelola surat masuk, surat keluar, dan disposisi dalam satu aplikasi yang mudah dipakai petugas TU.</p><ul>'
    + "<li>" + ic("inbox") + "<span>Catat surat dengan Nomor Agenda yang rapi dan mudah dicari</span></li>"
    + "<li>" + ic("disposition") + "<span>Pantau disposisi yang belum selesai dan terlambat</span></li>"
    + "<li>" + ic("report") + "<span>Cetak Buku Agenda dan Rekap Tahunan siap tanda tangan</span></li></ul></div>"
    + '<div class="lr"><form class="lc card" id="formLogin"><div><h2>Masuk ke E-Arsip</h2><p class="mu" style="font-size:13px">Gunakan akun petugas dari admin.</p></div>'
    + '<div class="fl"><label>Nama Pengguna</label><input id="liUser" autocomplete="username" required></div>'
    + '<div class="fl"><label>Kata Sandi</label><div class="pw"><input id="liPass" type="password" autocomplete="current-password" required><button type="button" id="liEye" aria-label="Tampilkan kata sandi">' + ic("eye") + "</button></div></div>"
    + (err ? '<p class="er">' + esc(err) + "</p>" : "")
    + '<label class="acts" style="gap:6px;font-weight:500"><input type="checkbox" id="liIngat" style="width:auto;height:auto"> Ingat saya di perangkat ini (30 hari)</label>'
    + '<button class="btn lgb" id="liBtn" type="submit">' + ic("lock") + "<span>Masuk</span></button></form></div></div>";
  $("#liEye").onclick = () => { const i = $("#liPass"); i.type = i.type === "password" ? "text" : "password"; };
  $("#formLogin").onsubmit = async (e) => {
    e.preventDefault();
    const b = $("#liBtn"); b.disabled = true; b.innerHTML = '<span class="spin"></span><span>Memproses...</span>';
    try {
      const d = await api("/api/login", { method: "POST", body: JSON.stringify({ username: $("#liUser").value.trim(), password: $("#liPass").value, ingat: $("#liIngat").checked }) });
      me = d.user; await masukAplikasi();
    } catch (er) { renderLogin(er.message); }
  };
}
function parseRute() {
  const seg = String(location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
  if (!seg.length) return null;
  const p = seg[0];
  if (["beranda", "masuk", "keluar", "disposisi", "agenda", "rekap", "sampah", "pengaturan", "audit", "guru"].includes(p)) return { p };
  if (p === "detail" && seg[1]) return { p, arg: parseInt(seg[1], 10) || seg[1] };
  if (p === "cari" && seg[1]) return { p, arg: { q: decodeURIComponent(seg.slice(1).join("/")) } };
  return null;
}
async function masukAplikasi() {
  const [rm, rk, rs] = await Promise.all([api("/api/me").catch(() => null), api("/api/klasifikasi").catch(() => null), api("/api/settings").catch(() => null)]);
  if (rm) { me = rm.user; r2Aktif = !!rm.r2_aktif; }
  if (rk) klasList = rk.items || [];
  SETTINGS = rs ? (rs.settings || rs || {}) : {};
  $("#loginView").hidden = true; $("#appView").hidden = false;
  renderShell(); const pr = parseRute(); if (pr) go(pr.p, pr.arg); else go("beranda");
}
async function keluar() { try { await api("/api/logout", { method: "POST" }); } catch (e) {} me = null; renderLogin(); }

/* ---------- shell ---------- */
const MENU = [
  ["UTAMA", [["beranda", "Beranda", "dashboard"], ["masuk", "Surat Masuk", "inbox"], ["keluar", "Surat Keluar", "outbox"], ["disposisi", "Disposisi", "disposition"]]],
  ["LAPORAN", [["agenda", "Buku Agenda", "agenda"], ["rekap", "Rekap Tahunan", "report"]]],
  ["ADMINISTRASI", [["guru", "Data Guru", "users"], ["sampah", "Tempat Sampah", "trash"], ["pengaturan", "Pengaturan", "settings"]]],
];
const JUDUL = { beranda: "Beranda", masuk: "Surat Masuk", keluar: "Surat Keluar", detail: "Detail Surat", disposisi: "Disposisi", form: "Tambah Surat", agenda: "Buku Agenda", rekap: "Rekap Tahunan", sampah: "Tempat Sampah", pengaturan: "Pengaturan", audit: "Audit", cari: "Pencarian", guru: "Data Guru" };
function renderShell() {
  let h = '<div class="br"><div class="bm">' + ic("letterhead") + '</div><div class="bt"><b>E-Arsip</b><small class="nl">' + esc(namaInstansi()) + "</small></div></div>";
  h += '<nav class="sn">';
  for (const [grup, items0] of MENU) {
    const items = grup === "ADMINISTRASI" && me.role === "admin" ? [...items0, ["audit", "Audit", "eye"]] : items0;
    h += '<div class="ng">' + grup + "</div>";
    for (const [k, label, ikon] of items) h += '<button class="nv" data-go="' + k + '" data-k="' + k + '">' + ic(ikon) + '<span class="nl">' + label + "</span>" + (k === "disposisi" ? '<span class="bdg" id="bdgDisp" hidden></span>' : "") + "</button>";
  }
  h += '</nav><div class="sf"><div class="us"><div class="av">' + esc(inisial(me.nama)) + '</div><div class="nl"><b>' + esc(me.nama) + "</b><small>" + esc(ROLE_LABEL[me.role] || me.role) + '</small></div></div>'
    + '<button class="nv" id="btnKeluar">' + ic("logout") + '<span class="nl">Keluar</span></button><div class="sver">Versi 1.4.5</div></div>';
  if (!r2Aktif) h += '<div class="note wn" style="margin:12px 4px 0;font-size:12px">' + ic("warning") + "<span>Upload file belum aktif. Hubungi admin.</span></div>";
  $("#sb").innerHTML = h;
  $$("#sb [data-go]").forEach((b) => (b.onclick = () => go(b.dataset.go)));
  $("#btnKeluar").onclick = () => konfirmasi("Keluar dari E-Arsip?", "Sesi Anda akan diakhiri. Anda perlu masuk lagi untuk melanjutkan pekerjaan.", "Keluar", keluar);
  $("#ovl").onclick = () => document.body.classList.remove("nav");
  segarLencana();
}
async function segarLencana() {
  try {
    const d = await api("/api/lencana");
    const b = $("#bdgDisp"), hd = $("#hDot");
    if (b) { if (d.disposisi_belum > 0) { b.hidden = false; b.textContent = d.disposisi_belum > 99 ? "99+" : String(d.disposisi_belum); b.classList.toggle("tl", d.disposisi_telat > 0); } else b.hidden = true; }
    if (hd) hd.hidden = !(d.disposisi_belum > 0);
  } catch (e) {}
}
document.addEventListener("click", (e) => { const m = $("#aMenu"); if (m && !m.hidden && !(e.target.closest && e.target.closest(".akun"))) m.hidden = true; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { const m = $("#aMenu"); if (m) m.hidden = true; } });
function renderTop() {
  $("#topbar").innerHTML = '<div class="acts"><button class="hb" id="hbBtn" aria-label="Buka menu">' + ic("menu") + '<span class="hdot" id="hDot" hidden></span></button><span class="crumb"><span class="cinst">' + esc(namaInstansi()) + '</span><span class="sep">/</span><b>' + esc(JUDUL[cur.p] || "") + "</b></span></div>"
    + '<form class="gcari" id="gCari"><input id="gQ" placeholder="Cari surat masuk atau keluar..." autocomplete="off"></form>'
    + '<div class="akun"><button class="av" id="avBtn" title="' + esc(me.nama) + '" aria-label="Menu akun">' + esc(inisial(me.nama)) + '</button>'
    + '<div class="amenu" id="aMenu" hidden><div class="am-h"><div class="av">' + esc(inisial(me.nama)) + '</div><div><b>' + esc(me.nama) + '</b><small>' + (me.username ? "@" + esc(me.username) + " - " : "") + esc(ROLE_LABEL[me.role] || me.role) + '</small></div></div>'
    + '<button id="amPass">' + ic("lock") + '<span>Ganti Password</span></button><div class="am-sep"></div>'
    + '<button id="amOut" class="dg">' + ic("logout") + '<span>Keluar</span></button></div></div>';
  $("#hbBtn").onclick = () => document.body.classList.toggle("nav");
  $("#avBtn").onclick = (e) => { e.stopPropagation(); const m = $("#aMenu"); m.hidden = !m.hidden; };
  $("#amPass").onclick = () => { $("#aMenu").hidden = true; setTab = "password"; go("pengaturan"); };
  $("#amOut").onclick = () => { $("#aMenu").hidden = true; konfirmasi("Keluar dari E-Arsip?", "Sesi Anda akan diakhiri. Anda perlu masuk lagi untuk melanjutkan pekerjaan.", "Keluar", keluar); };
  $("#gCari").onsubmit = (e) => { e.preventDefault(); const q = $("#gQ").value.trim(); if (q) go("cari", { q }); };
}
function go(p, arg) {
  cur = { p, arg };
  const RUTE = ["beranda", "masuk", "keluar", "disposisi", "agenda", "rekap", "sampah", "pengaturan", "audit", "guru", "detail", "cari"];
  if (RUTE.includes(p)) { let h = "#/" + p; if (p === "detail" && arg != null) h += "/" + encodeURIComponent(arg); if (p === "cari" && arg && arg.q) h += "/" + encodeURIComponent(arg.q); try { history.replaceState(null, "", h); } catch (e) {} }
  document.body.classList.remove("nav");
  renderTop();
  segarLencana();
  const nk = p === "detail" && window._detailJenis ? window._detailJenis : p;
  $$("#sb .nv[data-k]").forEach((n) => n.classList.toggle("on", n.dataset.k === nk || (p === "form" && false)));
  const fn = { beranda: viewBeranda, masuk: () => viewList("masuk"), keluar: () => viewList("keluar"), detail: viewDetail, disposisi: viewDisposisi, form: viewForm, agenda: viewAgenda, rekap: viewRekap, sampah: viewSampah, pengaturan: viewPengaturan, audit: viewAudit, cari: viewCari, guru: viewGuru }[p];
  if (fn) fn(arg);
  const mn = $("#main"); if (mn) { mn.classList.remove("vin"); void mn.offsetWidth; mn.classList.add("vin"); }
  window.scrollTo(0, 0);
}
function headPage(judul, sub, aksiHtml) {
  return '<div class="phd"><div><h1>' + esc(judul) + "</h1><p>" + esc(sub) + '</p></div><div class="acts">' + (aksiHtml || "") + "</div></div>";
}
function kosong(teks, sub) { return '<div class="em">' + ic("inbox") + "<b>" + esc(teks) + "</b><span>" + esc(sub || "") + "</span></div>"; }

/* ---------- beranda ---------- */
async function viewBeranda() {
  $("#main").innerHTML = headPage("Beranda", "Memuat ringkasan...") + '<div class="card cb">' + rangka(5) + "</div>";
  let d; try { d = await api("/api/dashboard"); } catch (e) { $("#main").innerHTML = headPage("Beranda", "") + '<div class="card cb er">' + esc(e.message) + "</div>"; return; }
  const max = Math.max(1, ...d.per_bulan.map((b) => b.total || 0));
  let chart = '<div class="chart">';
  const sumbuBulan = []; { const kini = new Date(); for (let i = 5; i >= 0; i--) sumbuBulan.push(new Date(kini.getFullYear(), kini.getMonth() - i, 1).getMonth()); }
  for (const m of sumbuBulan) {
    const b = d.per_bulan.find((x) => parseInt(x.bln, 10) === m + 1) || { total: 0 };
    chart += '<div class="bc"><div class="bp"><div class="b" style="height:' + Math.max(4, Math.round(((b.total || 0) / max) * 100)) + '%"><span>' + (b.total || 0) + '</span></div></div><div class="bl">' + BULAN_ID[m].slice(0, 3) + "</div></div>";
  }
  chart += "</div>";
  let peringatan = "";
  if (!d.perhatian.length) peringatan = '<div class="cb mu">Tidak ada disposisi yang perlu perhatian. Semua tindak lanjut selesai.</div>';
  else peringatan = d.perhatian.map((x) => { const tl = terlambatDisp(x); return '<button class="pa" data-detail="' + (x.surat_id || "") + '"><span class="si ' + (tl ? "dg" : "wn") + '">' + ic(tl ? "warning" : "clock") + '</span><span style="flex:1"><b>' + esc(ringkas(x.perihal)) + "</b><small>" + esc(x.nomor_agenda || "") + " - kepada " + esc(x.kepada || "-") + ", batas " + fmtTgl(x.batas_waktu) + "</small></span>" + (tl ? '<span class="bd dg">Terlambat</span>' : badgeStatus(x.sts === "Baru" ? "Belum" : x.sts)) + "</button>"; }).join("");
  $("#main").innerHTML = headPage("Beranda", "Ringkasan kegiatan surat " + BULAN_ID[new Date().getMonth()] + " " + new Date().getFullYear(), '<button class="btn" id="bTambah">' + ic("plus") + "Tambah Surat</button>")
    + '<div class="card" style="margin-bottom:16px"><form class="sr" id="berandaCari" style="width:100%">' + ic("search") + '<input id="berandaQ" placeholder="Cari surat masuk atau keluar: nomor, perihal, asal, tujuan..." autocomplete="off" style="flex:1"></form></div>'
    + '<div class="stats tiga">'

async function muatList(jenis) {
  const st = listState[jenis];
  const qs = new URLSearchParams({ jenis, page: st.page });
  if (st.q) qs.set("q", st.q); if (st.bulan) qs.set("bulan", st.bulan); if (st.sifat) qs.set("sifat", st.sifat);
  if (st.klasifikasi) qs.set("klasifikasi", st.klasifikasi); if (st.status) qs.set("status", st.status); if (st.tanpa_scan) qs.set("tanpa_scan", "1");
  qs.set("sort", st.sort); qs.set("dir", st.dir);
  let d; try { d = await api("/api/surat?" + qs); } catch (e) { $("#listBody").innerHTML = '<div class="cb er">' + esc(e.message) + "</div>"; return; }
  if (!d.items.length) { $("#listBody").innerHTML = kosong("Tidak ada surat yang cocok", "Coba longgarkan kata kunci atau filter."); return; }
  const pages = Math.max(1, Math.ceil(d.total / 25));
  const tc0 = $("#tbCount"); if (tc0) tc0.textContent = d.total + " surat";
  const chips = [];
  if (st.q) chips.push(["q", "Kata: " + st.q]);

  if (st.klasifikasi) chips.push(["klasifikasi", "Klasifikasi: " + st.klasifikasi]);
  if (st.sifat) chips.push(["sifat", "Sifat: " + st.sifat]);
  if (st.status) chips.push(["status", "Status: " + st.status]);
  if (st.tanpa_scan) chips.push(["tanpa_scan", "Berkas belum diunggah" + (d.total ? " (" + d.total + " surat)" : "")]);
  let h = (chips.length ? '<div class="chips">' + chips.map(([k, l]) => '<span class="chip">' + esc(l) + '<button type="button" data-chip="' + k + '" aria-label="Hapus filter">×</button></span>').join("") + "</div>" : "") + '<div class="tw"><table class="a"><thead><tr>' + "<th style=\"width:40px\"><input type=\"checkbox\" id=\"selSemua\" aria-label=\"Pilih semua surat\"></th><th style=\"width:52px\">No</th>" + thUrut("Nomor Surat", "nomor", st) + thUrut("Tanggal Agenda", "tanggal", st) + thUrut("Perihal", "perihal", st) + "<th>" + (jenis === "masuk" ? "Asal" : "Tujuan") + "</th>" + thUrut("Klasifikasi", "klasifikasi", st) + thUrut("Sifat", "sifat", st) + thUrut("Status", "status", st) + "<th>Aksi</th></tr></thead><tbody>";
  d.items.forEach((r, idx) => {
    h += '<tr class="rw" data-id="' + r.id + '"><td><input type="checkbox" class="row-check" data-id="' + r.id + '"' + (st.pilih.has(r.id) ? " checked" : "") + ' aria-label="Pilih surat"></td><td>' + ((st.page - 1) * 25 + idx + 1) + '</td><td><b>' + esc(r.nomor_surat) + "</b><small>Agenda " + esc(r.nomor_agenda || "-") + "</small></td><td>" + fmtTgl(r.tanggal_agenda) + "</td><td><b>" + esc(ringkas(r.perihal)) + "</b>" + (r.file_count ? '<small>' + r.file_count + ' berkas surat</small>' + (r.pendukung_count ? '<small>' + r.pendukung_count + ' lampiran pendukung</small>' : '') : '<div style="margin-top:4px"><span class="bd dg">' + ic("upload") + 'Berkas belum diunggah</span></div>') + "</td><td>" + esc(ringkas((jenis === "masuk" ? r.asal : r.tujuan) || "-")) + "</td><td>" + esc(r.klasifikasi || "-") + "</td><td>" + badgeSifat(r.sifat) + "</td><td>" + (jenis === "masuk" ? badgeStatus(r.status_disposisi) + (() => { const tg = labelTenggat(r.tenggat); return tg ? '<div style="margin-top:4px"><span class="bd ' + tg.k + '">' + tg.t + "</span></div>" : ""; })() : '<span class="bd ok">Terkirim</span>') + '</td><td><span class="acts" style="justify-content:flex-end">' + (canEditNow() && r2Aktif && !r.file_count ? '<button class="btn sec sm" data-unggah="' + r.id + '">' + ic("upload") + "Unggah</button>" : "") + '<button class="btn lk" data-detail="' + r.id + '">Detail</button></span></td></tr>';
  });
  h += '</tbody></table></div><p class="scnote">Geser ke kanan untuk kolom lainnya</p><div class="pg"><span>Menampilkan ' + d.items.length + " dari " + d.total + " surat</span><span class=\"acts\">"

  segarMassal(jenis);
}

function segarMassal(jenis) {
  const st = listState[jenis]; if (!st) return;
  const n = st.pilih.size;
  const bb = $("#bHapusMassal"); if (bb) { bb.disabled = n === 0; bb.textContent = n ? "Hapus (" + n + ")" : "Hapus Terpilih"; }
  const sa = $("#selSemua"); if (sa) { const vis = $$("#listBody .row-check"); const cek = vis.filter((c) => c.checked).length; sa.checked = vis.length > 0 && cek === vis.length; sa.indeterminate = cek > 0 && cek < vis.length; }
}
async function hapusMassal(jenis) {
  const st = listState[jenis]; if (!st || !st.pilih.size) return;
  const ids = [...st.pilih]; const n = ids.length;
  konfirmasi("Hapus " + n + " surat?", "Surat yang dipilih akan dipindahkan ke Tempat Sampah dan bisa dipulihkan dalam 30 hari.", "Hapus", async () => {
    let gagal = 0;
    for (const id of ids) { try { await api("/api/surat/" + id, { method: "DELETE" }); } catch (e) { gagal++; } }

    toast(gagal ? (n - gagal) + " surat dipindahkan, " + gagal + " gagal" : n + " surat dipindahkan ke Tempat Sampah", gagal > 0);
    muatList(jenis);
  });
}

async function muatAgenda() {
  const q = new URLSearchParams();
  if (/^\d{4}-\d{2}$/.test(agState.bulan)) q.set("bulan", agState.bulan); else if (/^\d{4}$/.test(agState.bulan)) q.set("tahun", agState.bulan);

  let d; try { d = await api("/api/agenda?" + q); } catch (e) { $("#agBody").innerHTML = '<div class="cb er">' + esc(e.message) + "</div>"; return; }
  renderAgendaRows(d);
}
async function muatAgendaMode(mode) {
  if (mode === "bulan" || mode === "semua") return muatAgenda();
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth() + 1;
  let bulanList = [];
  if (mode === "triwulan") { const start = Math.floor((m - 1) / 3) * 3 + 1; bulanList = [0, 1, 2].map((i) => y + "-" + String(start + i).padStart(2, "0")); }
  else if (mode === "tahun") { const q = new URLSearchParams({ tahun: y }); if (agState.jenis) q.set("jenis", agState.jenis); try { renderAgendaRows(await api("/api/agenda?" + q)); } catch (e) { $("#agBody").innerHTML = '<div class="cb er">' + esc(e.message) + "</div>"; } return; }
  try {
    const hasil = await Promise.all(bulanList.map(async (b) => { const q = new URLSearchParams({ bulan: b }); if (agState.jenis) q.set("jenis", agState.jenis); q.set("sort", agState.sort); q.set("dir", agState.dir); return api("/api/agenda?" + q); }));

}

async function muatAudit(isiAksi) {

async function setKlasifikasi() {
  try { const k = await api("/api/klasifikasi"); klasList = k.items || []; } catch (e) {}
  $("#setBody").innerHTML = '<div class="card"><div class="ch"><h2>Klasifikasi Surat</h2></div><div class="cb">'
    + (klasList.length ? klasList.map((k) => '<div class="acts" style="justify-content:space-between;border-bottom:1px solid var(--bd);padding:8px 0"><span><b>' + esc(k.nama) + '</b> <span class="mu">Kode: ' + esc(k.kode || "-") + '</span></span><span class="acts"><button class="btn sec sm" data-klas-ubah="' + k.id + '">Ubah</button><button class="btn dgo sm" data-klas-hapus="' + k.id + '">Hapus</button></span></div>').join("") : '<p class="mu">Belum ada klasifikasi.</p>')
    + '<form id="formKlas" class="acts mt"><input id="klNama" placeholder="Nama klasifikasi baru" required style="flex:1"><button class="btn" type="submit">' + ic("plus") + "Tambah</button></form></div></div>";
  $("#formKlas").onsubmit = async (e) => { e.preventDefault(); try { await api("/api/klasifikasi", { method: "POST", body: JSON.stringify({ nama: $("#klNama").value.trim() }) }); toast("Klasifikasi ditambahkan"); setKlasifikasi(); } catch (er) { toast(er.message, true); } };
  $$("[data-klas-ubah]").forEach((b) => b.onclick = () => { const k = klasList.find((x) => String(x.id) === b.dataset.klasUbah); if (!k) return; modal('<h2 style="margin-bottom:8px">Ubah Klasifikasi</h2><p class="mu" style="margin-bottom:14px">Nama baru berlaku juga untuk semua surat yang memakai klasifikasi ini.</p><div class="fl"><label>Nama Klasifikasi</label><input id="klNamaBaru" value="' + esc(k.nama) + '"></div><div class="acts end"><button class="btn sec" id="klUbahBatal">Batal</button><button class="btn" id="klUbahSimpan">Simpan</button></div>'); $("#klUbahBatal").onclick = () => tutupModal(); $("#klUbahSimpan").onclick = async () => { const nama = $("#klNamaBaru").value.trim(); if (!nama) { toast("Nama klasifikasi wajib diisi", true); return; } try { await api("/api/klasifikasi/" + k.id, { method: "PUT", body: JSON.stringify({ nama }) }); tutupModal(); toast("Klasifikasi diubah"); setKlasifikasi(); } catch (er) { toast(er.message, true); } }; });
  $$("[data-klas-hapus]").forEach((b) => b.onclick = () => { const k = klasList.find((x) => String(x.id) === b.dataset.klasHapus); if (!k) return; modal('<h2 style="margin-bottom:8px">Hapus Klasifikasi</h2><p class="mu" style="margin-bottom:20px">Hapus klasifikasi <b>' + esc(k.nama) + '</b>? Klasifikasi yang masih dipakai surat tidak bisa dihapus.</p><div class="acts end"><button class="btn sec" id="klHapusBatal">Batal</button><button class="btn dg" id="klHapusYa">Hapus</button></div>'); $("#klHapusBatal").onclick = () => tutupModal(); $("#klHapusYa").onclick = async () => { try { await api("/api/klasifikasi/" + k.id, { method: "DELETE" }); tutupModal(); toast("Klasifikasi dihapus"); setKlasifikasi(); } catch (er) { toast(er.message, true); } }; });
}
function setPassword() {
  $("#setBody").innerHTML = '<div class="card"><div class="ch"><h2>Ganti Password Saya</h2></div><div class="cb"><form id="formPw"><div class="fl"><label>Password Lama</label><input id="pwLama" type="password" required autocomplete="current-password"></div><div class="fl"><label>Password Baru <span class="rq">minimal 8 karakter</span></label><input id="pwBaru" type="password" required minlength="8" autocomplete="new-password"></div><div class="fl"><label>Ulangi Password Baru</label><input id="pwUlangi" type="password" required minlength="8" autocomplete="new-password"></div><button class="btn" type="submit">' + ic("lock") + "Ganti Password</button></form></div></div>";
  $("#formPw").onsubmit = async (e) => { e.preventDefault(); if ($("#pwBaru").value !== $("#pwUlangi").value) { toast("Ulangi password baru tidak sama", true); return; } try { await api("/api/me/password", { method: "PUT", body: JSON.stringify({ lama: $("#pwLama").value, password: $("#pwBaru").value }) }); toast("Password berhasil diganti untuk login berikutnya"); e.target.reset(); } catch (er) { toast(er.message, true); } };
}
async function setUsers() {
  let users = []; try { users = (await api("/api/users")).items || []; } catch (e) { toast(e.message, true); }
  $("#setBody").innerHTML = '<div class="card"><div class="ch"><h2>Pengguna</h2></div><div class="cb">'
    + (users.length ? users.map((u) => '<div class="acts" style="justify-content:space-between;border-bottom:1px solid var(--bd);padding:8px 0"><span><b>' + esc(u.nama) + '</b> <span class="mu">@' + esc(u.username) + "</span></span>" + '<span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="bd ' + (u.role === "admin" ? "pr" : "gr") + '">' + esc(ROLE_LABEL[u.role] || u.role) + '</span><span class="bd ' + (u.aktif ? "ok" : "wn") + '">' + (u.aktif ? "Aktif" : "Nonaktif") + '</span>' + (u.id !== me.id ? '<button class="btn sec sm" data-resetpw="' + u.id + '" data-nama="' + esc(u.nama) + '">Reset Password</button><button class="btn sec sm" data-togaktif="' + u.id + '" data-aktif="' + u.aktif + '">' + (u.aktif ? "Nonaktifkan" : "Aktifkan") + "</button>" : '<span class="bd gr">Akun Anda</span>') + "</span></div>").join("") : '<p class="mu">Belum ada pengguna.</p>')
    + '<form id="formUser" class="mt"><h3>Tambah Pengguna</h3><div class="fg"><div class="fl"><label>Nama Lengkap</label><input id="usNama" required></div><div class="fl"><label>Username</label><input id="usUser" required></div><div class="fl"><label>Password Awal</label><input id="usPass" type="text" required minlength="8"></div><div class="fl"><label>Peran</label><select id="usRole">' + Object.keys(ROLE_LABEL).map((r) => '<option value="' + r + '">' + ROLE_LABEL[r] + "</option>").join("") + '</select></div></div><button class="btn" type="submit">' + ic("plus") + "Tambah Pengguna</button></form></div></div>";
  $("#formUser").onsubmit = async (e) => { e.preventDefault(); try { await api("/api/users", { method: "POST", body: JSON.stringify({ nama: $("#usNama").value.trim(), username: $("#usUser").value.trim(), password: $("#usPass").value, role: $("#usRole").value }) }); toast("Pengguna ditambahkan"); setUsers(); } catch (er) { toast(er.message, true); } };
  $$("[data-togaktif]").forEach((b) => (b.onclick = () => { const matikan = b.dataset.aktif === "1"; const jalankan = async () => { try { await api("/api/users/" + b.dataset.togaktif, { method: "PUT", body: JSON.stringify({ aktif: matikan ? 0 : 1 }) }); toast(matikan ? "Pengguna dinonaktifkan" : "Pengguna diaktifkan"); setUsers(); } catch (er) { toast(er.message, true); } }; if (matikan) konfirmasi("Nonaktifkan pengguna ini?", "Pengguna yang dinonaktifkan tidak bisa masuk ke aplikasi sampai diaktifkan kembali.", "Nonaktifkan", jalankan); else jalankan(); }));
  $$("[data-resetpw]").forEach((b) => (b.onclick = () => dialogResetPassword(b.dataset.resetpw, b.dataset.nama)));
}
function dialogResetPassword(id, nama) {
  modal('<h2 style="margin-bottom:8px">Reset Password</h2><p class="mu" style="margin-bottom:14px">Buat password baru untuk <b>' + esc(nama) + '</b>. Password lama tidak bisa dibaca kembali, hanya bisa diganti. Sampaikan password baru ini langsung ke orangnya.</p><div class="fl" style="margin-bottom:12px"><label>Password Baru <span class="rq">minimal 8 karakter</span></label><input id="rpBaru" type="text" minlength="8" autocomplete="off"></div><div class="fl" style="margin-bottom:18px"><label>Ulangi Password Baru</label><input id="rpUlang" type="text" minlength="8" autocomplete="off"></div><div class="acts end"><button class="btn sec" onclick="tutupModal()">Batal</button><button class="btn" id="btnResetPw">Simpan Password Baru</button></div>');
  $("#btnResetPw").onclick = async () => {
    const a = $("#rpBaru").value, b = $("#rpUlang").value;
    if (a.length < 8) { toast("Password baru minimal 8 karakter", true); return; }
    if (a !== b) { toast("Pengulangan password tidak sama", true); return; }
    try { await api("/api/users/" + id, { method: "PUT", body: JSON.stringify({ password: a }) }); tutupModal(); toast("Password " + nama + " berhasil direset"); } catch (er) { toast(er.message, true); }
  };
}
